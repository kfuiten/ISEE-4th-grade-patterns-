<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patterns in Diagrams: ISEE Practice Set</title>
<style>
:root{--bg:#fbfaf6;--card:#fff;--ink:#1f2a37;--mute:#5b6675;--line:#cfd6e2;--accent:#2b4a8b;--ok:#1f7a45;--bad:#b3362b;--blue:#4f6fbf;--green:#4f7f3a;--red:#e5382a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a21;--card:#1f2530;--ink:#e8ecf2;--mute:#a2adbd;--line:#3a4454;--accent:#8fb0ff;--ok:#5fd08e;--bad:#ff8b7d}}
:root[data-theme="dark"]{--bg:#161a21;--card:#1f2530;--ink:#e8ecf2;--mute:#a2adbd;--line:#3a4454;--accent:#8fb0ff;--ok:#5fd08e;--bad:#ff8b7d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Avenir Next","Trebuchet MS",Verdana,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.9rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 18px}
.q h2{font-size:1.05rem;margin:0 0 10px}
.q h2 span{color:var(--accent)}
.figs{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;overflow-x:auto;padding:6px 0 10px}
.fig{text-align:center;font-size:.85rem;color:var(--mute)}
.fig svg{display:block;margin:4px auto 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.choice b{display:inline-flex;width:28px;height:28px;border:1.5px solid var(--accent);color:var(--accent);border-radius:50%;align-items:center;justify-content:center;flex:none}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.choice.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.why{display:none;margin:10px 0 0;color:var(--mute);font-size:.95rem}
.q.done .why{display:block}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.bar button{font:inherit;padding:8px 14px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
#score{color:var(--mute)}
svg .l{stroke:var(--accent);stroke-width:1.5;fill:none}
svg .w{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
svg .ink{fill:var(--ink)}
@media print{.bar{display:none}.why{display:block!important}body{background:#fff}}
</style>
</head>
<body>
<main>
<h1>Patterns in Diagrams</h1>
<p class="sub">9 practice questions for 4th grade ISEE. Study how each figure changes from one to the next, then pick the best answer. Tap a choice to check it.</p>
<div class="bar"><button id="reset">Start over</button><span id="score" aria-live="polite"></span></div>
<div id="set"></div>
</main>
<script>
const S=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${b}</svg>`;
const grid=p=>{const c=[[0,0],[30,0],[30,30],[0,30]];let b='';for(let i=0;i<4;i++){const q=c[i];b+=`<rect class="w" x="${q[0]+1}" y="${q[1]+1}" width="30" height="30" ${i==p?'style="fill:var(--blue)"':''}/>`}return S(62,62,b)};
const pie=set=>{let b='';for(let i=0;i<8;i++){const a=i*Math.PI/4,e=(i+1)*Math.PI/4,P=t=>[32+29*Math.sin(t),32-29*Math.cos(t)];const[x1,y1]=P(a),[x2,y2]=P(e);b+=`<path d="M32 32L${x1} ${y1}A29 29 0 0 1 ${x2} ${y2}Z" class="w" ${set.includes(i)?'style="fill:var(--green)"':''}/>`}return S(64,64,b)};
const rects=n=>{const c=n+1;let b='';for(let i=0;i<c;i++)for(let j=0;j<2;j++)b+=`<rect class="w" x="${2+i*18}" y="${2+j*18}" width="18" height="18"/>`;return S(c*18+4,40,b)};
const dots=n=>{let b='';for(let r=1;r<=n;r++)for(let k=0;k<r;k++)b+=`<circle cx="${9+(n-r)*8+k*16}" cy="${9+(r-1)*14}" r="8" fill="var(--red)" stroke="#222"/>`;return S(n*16+2,(n-1)*14+20,b)};
const shp=t=>{const m={c:'<circle cx="18" cy="18" r="13"/>',s:'<rect x="5" y="5" width="26" height="26"/>',t:'<polygon points="18,4 32,31 4,31"/>',d:'<polygon points="18,3 33,18 18,33 3,18"/>'};return S(36,36,`<g class="ink">${m[t]}</g>`)};
const circs=(a,b)=>{const w=Math.max(a,b);let o='';for(let k=0;k<a;k++)o+=`<circle cx="${(w-a)*9+10+k*18}" cy="10" r="9" fill="var(--red)" stroke="#222"/>`;for(let k=0;k<b;k++)o+=`<circle cx="${(w-b)*9+10+k*18}" cy="27" r="9" fill="var(--red)" stroke="#222"/>`;return S(w*18+2,38,o)};
const sticks=n=>{let b=`<path class="l" style="stroke-width:3" d="M3 3H${3+n*24}M3 27H${3+n*24}`;for(let i=0;i<=n;i++)b+=`M${3+i*24} 3V27`;return S(n*24+6,30,b+'"/>')};
const plus=n=>{const s=14,N=2*n+1;let b='';const f=(i,j)=>b+=`<rect class="w" x="${2+i*s}" y="${2+j*s}" width="${s}" height="${s}" style="fill:var(--blue)"/>`;for(let k=0;k<N;k++){b=b;f(k,n);if(k!=n)f(n,k)}return S(N*s+4,N*s+4,b)};
const arrow=d=>S(40,40,`<polygon class="ink" points="20,3 33,18 24,18 24,37 16,37 16,18 7,18" transform="rotate(${d*90} 20 20)"/>`);
const T=x=>x;
const Q=[
{t:'A pattern is shown. Which picture shows the square that will be shaded in the 10th figure?',
 f:[0,1,2,3,0,1].map((p,i)=>[i+1,grid(p)]),c:[0,2,1,3].map(grid),a:2,
 w:'The shaded square moves clockwise and repeats every 4 figures. Figures 4, 8 and 12 are bottom left, so figure 9 is top left and figure 10 is top right.'},
{t:'A pattern is shown below. Which picture shows the slices that will be shaded in the 7th figure?',
 f:[0,2,4,6].map((p,i)=>[i+1,pie([p])]),c:[6,4,0,2].map(p=>pie([p])),a:1,
 w:'The shaded slice moves 2 slices clockwise each time, so it lands on slice 0, 2, 4, 6, then back to 0. Figure 5 matches figure 1, figure 6 matches figure 2, and figure 7 matches figure 3, with the slice at the bottom.'},
{t:'A pattern is shown. The first figure is made of 4 small squares. How many small squares will be in the 7th figure?',
 f:[1,2,3].map(n=>[n,rects(n)]),c:['14','18','16','20'],a:2,
 w:'Each new figure adds one column of 2 squares. The figures have 4, 6, 8 squares, so figure 7 has 4 + 6 × 2 = 16 squares.'},
{t:'A pattern is shown below. How many dots will be in the 5th figure?',
 f:[1,2,3,4].map(n=>[n,dots(n)]),c:['10','12','18','15'],a:3,
 w:'The counts are 1, 3, 6, 10. The amount added grows by 1 each time (+2, +3, +4), so figure 5 adds 5 more: 10 + 5 = 15.'},
{t:'A pattern of shapes repeats. What will the 20th shape look like?',
 f:[...'cstcstc'].map((p,i)=>[i+1,shp(p)]),c:['s','t','c','d'].map(shp),a:0,
 w:'The pattern (circle, square, triangle) repeats every 3 shapes. 20 ÷ 3 = 6 with 2 left over, so the 20th shape is the 2nd shape in the pattern: a square.'},
{t:'A pattern is shown below. What will the 5th figure look like?',
 f:[1,2,3].map(n=>[n,circs(n,n+1)]),c:[[4,5],[5,6],[6,5],[5,4]].map(p=>circs(...p)),a:1,
 w:'Figure 1 has 1 circle over 2, figure 2 has 2 over 3, figure 3 has 3 over 4. The top row matches the figure number and the bottom row has one more, so figure 5 has 5 over 6.'},
{t:'A pattern is shown below. Each line segment is one stick. How many sticks will be needed for the 6th figure?',
 f:[1,2,3].map(n=>[n,sticks(n)]),c:['18','21','19','22'],a:2,
 w:'The figures use 4, 7, 10 sticks. Each new square adds 3 sticks. Figure 6 has 4 + 5 × 3 = 19 sticks.'},
{t:'A pattern is shown. How many small squares will be in the 6th figure?',
 f:[1,2,3].map(n=>[n,plus(n)]),c:['21','25','24','28'],a:1,
 w:'The counts are 5, 9, 13. Each figure adds 4 squares, one on the end of each arm. Figure 6 has 5 + 5 × 4 = 25 squares.'},
{t:'An arrow turns in a pattern. Which arrow will be in the 15th figure?',
 f:[0,1,2,3,0].map((p,i)=>[i+1,arrow(p)]),c:[1,2,3,0].map(arrow),a:1,
 w:'The arrow turns a quarter turn clockwise each time and repeats every 4 figures. Figure 12 points left, figure 13 points up, 14 points right, and 15 points down.'}
];
const L='ABCD';let right=0,done=0;
const set=document.getElementById('set');
function build(){right=0;done=0;score();set.innerHTML=Q.map((q,i)=>`<section class="q" id="q${i}"><h2><span>${i+1}.</span> ${q.t}</h2><div class="figs">${q.f.map(f=>`<div class="fig">${f[0]}${f[1]}</div>`).join('')}</div><div class="choices">${q.c.map((c,j)=>`<button class="choice" data-i="${i}" data-j="${j}"><b>${L[j]}</b>${c.startsWith('<svg')||c.length<2?'':''}${/^[a-z]$/.test(c)?'':c}</button>`).join('')}</div><p class="why"><strong>Answer: ${L[q.a]}.</strong> ${q.w}</p></section>`).join('');
 document.querySelectorAll('.choice').forEach(b=>b.onclick=pick)}
function pick(e){const b=e.currentTarget,i=+b.dataset.i,j=+b.dataset.j,q=Q[i],box=document.getElementById('q'+i);if(box.classList.contains('done'))return;box.classList.add('done');done++;const bs=box.querySelectorAll('.choice');bs[q.a].classList.add('ok');if(j==q.a)right++;else b.classList.add('bad');score()}
function score(){document.getElementById('score').textContent=done?`${right} of ${done} correct so far`:''}
document.getElementById('reset').onclick=()=>{build();scrollTo(0,0)};
build();
</script>
</body>
</html>
